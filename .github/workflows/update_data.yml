name: Update Book Data & Deploy

on:
  schedule:
    # 毎週月曜日の午前9時 (日本時間) = 毎週日曜日 24:00 (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # 手動実行用
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Crawler Script
        env:
          CALIL_API_KEY: ${{ secrets.CALIL_API_KEY }}
        run: node cron_crawler.js

      - name: Commit and Push Updated Data (Optional but Recommended)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/books_data.json
          git commit -m "chore: Auto-update book selection data [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Build SPA
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
